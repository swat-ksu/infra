issuer: https://dex.swat-ksu.dev

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  alwaysShowLoginScreen: false
  skipApprovalScreen: true

connectors:
  - type: github
    id: github
    name: GitHub
    config:
      clientID: $GITHUB_CLIENT_ID
      clientSecret: $GITHUB_CLIENT_SECRET
      redirectURI: https://dex.swat-ksu.dev/callback
      orgs:
        - name: swat-ksu

staticClients:
  - id: outline
    name: Outline
    secretEnv: OUTLINE_CLIENT_SECRET
    redirectURIs:
      - https://outline.swat-ksu.dev/auth/oidc.callback

  - id: beszel
    name: Beszel
    secretEnv: BESZEL_CLIENT_SECRET
    redirectURIs:
      - https://beszel.swat-ksu.dev/api/oauth2-redirect
